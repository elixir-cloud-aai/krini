name: CI Checks

on:
  pull_request:
    branches:
      - dev
      - master
      - staging
  push:
    branches:
      - dev
      - master
      - staging

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # only the top-level `.env.example` may be committed; settings come in
      # at runtime
      - name: Check that no env files are committed
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -vx '\.env\.example' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Env files must not be committed: ${tracked}"
            exit 1
          fi

      # `.dockerignore` must keep local env files out of the build context,
      # which the Dockerfile copies with `COPY . .`
      - name: Check that env files stay out of the build context
        run: |
          # in a copy of the checkout, so that no local env file is touched
          context="$(mktemp -d)"
          git archive HEAD | tar -x -C "${context}"
          mkdir -p "${context}/env-check"
          for dir in "${context}" "${context}/env-check"; do
            for name in .env .env.local .env.development .env.development.local \
                .env.production .env.production.local .env.test .env.test.local; do
              touch "${dir}/${name}"
            done
          done
          # only the top-level example may enter the build context
          touch "${context}/env-check/.env.example"
          docker build --progress=plain --file - "${context}" <<'EOF'
          FROM busybox:1.37
          COPY . /context
          RUN ! find /context -name '.env*' ! -path /context/.env.example | grep .
          RUN test -f /context/.env.example
          EOF

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun run test:coverage

  # in the Playwright image, which has the browsers and their system
  # packages, with the Bun of the runner for the mock services and the app;
  # keep the image's version in line with `@playwright/test`
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run end-to-end tests
        run: >-
          docker run --rm --network host
          --user "$(id -u):$(id -g)" --env HOME=/tmp --env CI
          --env PATH=/opt/bun:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          --volume "$(readlink -f "$(command -v bun)"):/opt/bun/bun:ro"
          --volume "${PWD}:/app" --workdir /app
          mcr.microsoft.com/playwright:v1.56.1-noble
          npx playwright test

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
