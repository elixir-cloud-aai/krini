name: Deploy to OpenShift

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: krini-production-deployment
  cancel-in-progress: false

jobs:
  docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: anurag1201/krini:latest

  open-shift:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: docker-image
    environment: production

    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v2
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          certificate_authority_data: ${{ secrets.OPENSHIFT_CA_DATA }}

      - name: Switch to Krini project
        run: oc project krini

      - name: Trigger OpenShift Build
        run: oc rollout latest krini

      - name: OpenShift Logout
        if: always()
        run: oc logout