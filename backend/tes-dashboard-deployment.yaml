apiVersion: apps/v1
kind: Deployment
metadata:
  name: tes-dashboard
  labels:
    app: tes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tes-dashboard
  template:
    metadata:
      labels:
        app: tes-dashboard
    spec:
      containers:
      - name: tes-dashboard
        image: keshxvdayal/tes-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tes-dashboard-service
spec:
  type: NodePort
  selector:
    app: tes-dashboard
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
      name: http