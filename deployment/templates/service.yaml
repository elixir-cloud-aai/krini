apiVersion: v1
kind: Service
metadata:
  name: {{ include "krini.fullname" . | quote }}
  labels:
    {{- include "krini.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: http
  selector:
    {{- include "krini.selectorLabels" . | nindent 4 }}
