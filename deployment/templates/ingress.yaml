{{- /*
Ingress for `hostName`, for any ingress controller: the chart sets no
controller-specific annotations, which `krini.ingress.annotations` add. These
take precedence over the annotation requesting a certificate from
cert-manager (`krini.ingress.https`: the `issuer` of kind `issuerKind`, a
ClusterIssuer by default or a namespaced Issuer); `null` removes it. With
`https.existingSecret`, the Ingress serves the certificate of that Secret
and requests none. Fails if `krini.ingress.https.issuerKind` is set to
another kind (`null` means the default), if both `issuer` and
`existingSecret` are set, if the annotations name both a ClusterIssuer and
an Issuer, and if they name either with `existingSecret` (cert-manager
would overwrite that Secret).
*/ -}}
{{- $ingress := .Values.krini.ingress -}}
{{- if $ingress.enabled -}}
{{- $hostName := required "hostName must be set if krini.ingress.enabled" .Values.hostName -}}
{{- $https := $ingress.https | default dict -}}
{{- $annotations := dict -}}
{{- $issuerKind := "ClusterIssuer" -}}
{{- if not (kindIs "invalid" $https.issuerKind) -}}
{{- $issuerKind = $https.issuerKind -}}
{{- if not (has $issuerKind (list "ClusterIssuer" "Issuer")) -}}
{{- fail (printf "krini.ingress.https.issuerKind must be ClusterIssuer or Issuer, not %q" (toString $issuerKind)) -}}
{{- end -}}
{{- end -}}
{{- $secretName := printf "%s-tls" (include "krini.fullname" .) -}}
{{- if $https.enabled -}}
{{- if $https.existingSecret -}}
{{- if $https.issuer -}}
{{- fail "krini.ingress.https: set either krini.ingress.https.issuer or krini.ingress.https.existingSecret, not both (the certificate comes either from cert-manager or from the existing Secret)" -}}
{{- end -}}
{{- $secretName = $https.existingSecret -}}
{{- else -}}
{{- $issuerAnnotation := ternary "cert-manager.io/issuer" "cert-manager.io/cluster-issuer" (eq $issuerKind "Issuer") -}}
{{- $_ := set $annotations $issuerAnnotation (required "krini.ingress.https.issuer must be set if krini.ingress.https.enabled, unless krini.ingress.https.existingSecret is set" $https.issuer) -}}
{{- end -}}
{{- end -}}
{{- range $name, $value := $ingress.annotations | default dict -}}
{{- if kindIs "invalid" $value -}}
{{- $_ := unset $annotations $name -}}
{{- else -}}
{{- $_ := set $annotations $name $value -}}
{{- end -}}
{{- end -}}
{{- if and (hasKey $annotations "cert-manager.io/issuer") (hasKey $annotations "cert-manager.io/cluster-issuer") -}}
{{- fail "krini.ingress: the Ingress must not have both annotations cert-manager.io/issuer and cert-manager.io/cluster-issuer, which cert-manager refuses: set krini.ingress.https.issuerKind instead, or remove one with null in krini.ingress.annotations" -}}
{{- end -}}
{{- if and $https.enabled $https.existingSecret (or (hasKey $annotations "cert-manager.io/issuer") (hasKey $annotations "cert-manager.io/cluster-issuer")) -}}
{{- fail "krini.ingress.https.existingSecret must not be set together with an annotation cert-manager.io/issuer or cert-manager.io/cluster-issuer in krini.ingress.annotations: cert-manager would overwrite the existing Secret" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "krini.fullname" . | quote }}
  labels:
    {{- include "krini.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
  - host: {{ $hostName | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "krini.fullname" . | quote }}
            port:
              name: http
  {{- if $https.enabled }}
  tls:
  - hosts:
    - {{ $hostName | quote }}
    secretName: {{ $secretName | quote }}
  {{- end }}
{{- end }}
