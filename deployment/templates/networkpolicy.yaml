{{- /*
NetworkPolicy allowing connections to Krini only from the peers in
`krini.networkPolicy.ingressFrom` (e.g., the pods of the ingress
controller or Gateway; no defaults, as they depend on the cluster);
connections from the pod's node (the kubelet's probes) are always
allowed. The test pod of `helm test` gets no exception, as pod labels
can be forged. Egress isn't
restricted, as Krini's server connects to the registry, the login providers
and the services.
*/ -}}
{{- $policy := .Values.krini.networkPolicy -}}
{{- if $policy.enabled -}}
{{- if not $policy.ingressFrom -}}
{{- fail "krini.networkPolicy.ingressFrom must list at least one NetworkPolicy peer (no peers would allow all sources), e.g., the pods of the ingress controller or Gateway; set krini.networkPolicy.enabled to false to allow all sources" -}}
{{- end -}}
{{- range $peer := $policy.ingressFrom -}}
{{- if not (or $peer.podSelector $peer.namespaceSelector $peer.ipBlock) -}}
{{- fail "each peer of krini.networkPolicy.ingressFrom must set podSelector, namespaceSelector or ipBlock (a peer without them allows all sources)" -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "krini.fullname" . | quote }}
  labels:
    {{- include "krini.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "krini.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
      {{- toYaml $policy.ingressFrom | nindent 4 }}
    ports:
    - port: {{ include "krini.port" . }}
      protocol: TCP
{{- end }}
