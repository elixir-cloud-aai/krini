site_name: Krini
site_description: >-
  Virtual research environment for running and managing life science
  analyses on GA4GH TES and WES services, by ELIXIR On-Cloud
# Read the Docs serves each version under its own path (e.g., `/en/latest/`)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://krini.readthedocs.io/en/latest/"]
repo_url: https://github.com/elixir-cloud-aai/krini
repo_name: elixir-cloud-aai/krini
edit_uri: edit/dev/docs/
copyright: Copyright &copy; ELIXIR On-Cloud

# Packages of the build (not part of the site)
exclude_docs: |
  requirements.txt

theme:
  name: material
  logo: images/logo_elixir_on_cloud_night.png
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Release notes (`docs/releases/<version>.md`) go under "Releases", newest
# first, in the release-prep pull request (see "Releasing")
nav:
  - Home: index.md
  - User guide:
      - user-guide/index.md
      - Workflow examples: user-guide/workflow-examples.md
  - Operator guide:
      - operator-guide/index.md
      - Deployment: operator-guide/deployment.md
      - Helm chart: operator-guide/helm-chart.md
      - Configuration: operator-guide/configuration.md
      - Login: operator-guide/login.md
      - Upgrading: operator-guide/upgrading.md
  - Development:
      - development/index.md
      - Releasing: development/releasing.md
